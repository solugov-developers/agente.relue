<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Relue — offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        color: #eef2f6;
        background:
          radial-gradient(100% 80% at 50% 100%, hsl(194 76% 40% / 0.35), transparent 70%),
          #0a0a0e;
        text-align: center;
      }
      .card {
        max-width: 360px;
        padding: 32px 28px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        background: rgba(20, 22, 28, 0.55);
        backdrop-filter: blur(16px);
      }
      img { width: 76px; height: 76px; border-radius: 999px; margin-bottom: 18px; }
      h1 { font-size: 19px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.5; color: #9aa3b0; margin: 0 0 20px; }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 11px 22px;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        background: #167591;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icon-192.png" alt="Relue" />
      <h1>Você está offline</h1>
      <p>O Relue precisa de conexão para consultar a base de licitações. Verifique sua internet e tente de novo.</p>
      <button onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
